name: Sync URA District 13 Data

on:
  schedule:
    # URA's PMI_Resi_Transaction service updates end of day every Tue and
    # Fri. These run the morning after, 09:00 SGT (01:00 UTC), to give
    # URA's own publish time a buffer.
    - cron: '0 1 * * 3'   # Wednesday
    - cron: '0 1 * * 6'   # Saturday
  workflow_dispatch:       # lets you trigger a run manually from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run sync
        run: python sync_ura_data.py
        env:
          URA_ACCESS_KEY: ${{ secrets.URA_ACCESS_KEY }}
          URA_WP_IMPORT_KEY: ${{ secrets.URA_WP_IMPORT_KEY }}
          # Left as true on purpose. Nothing gets sent to WordPress while
          # this says true, it only prints what it would do. We flip this
          # to false together once a manual run's output looks right.
          DRY_RUN: 'true'
